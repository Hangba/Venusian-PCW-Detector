[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jiebang-venus-paper-repro"
version = "0.1.0"
description = "Reproduce the 揭榜挂帅 paper on pickup ions and the Venus induced magnetosphere"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bottleneck>=1.3", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.2",
  "PyWavelets>=1.5", "scipy>=1.11", "torch>=2.2", "tqdm>=4.66",
  "zstandard>=0.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
venus_express = ["assets/fonts/*"]
