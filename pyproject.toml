[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "venusian-pcw-detector"
version = "0.1.0"
description = "Detect proton cyclotron waves and analyze Venus Express magnetic-field observations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bottleneck>=1.3", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.2",
  "PyWavelets>=1.5", "scipy>=1.11", "torch>=2.2", "tqdm>=4.66",
  "zstandard>=0.22",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
venusian-pcw = "venusian_pcw.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
venus_express = ["assets/fonts/*"]
